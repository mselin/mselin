name: Profile games

# Plays a game of Snake on the contribution graph and a Game of Life from a random start, and publishes them
# as animated SVGs to the output branch, which the README shows. Runs nightly, by hand, and when the game code
# changes on main.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/scripts/profile_games.py
      - .github/workflows/snake.yml

permissions:
  contents: write

concurrency:
  group: profile-games
  cancel-in-progress: false

jobs:
  games:
    name: Play and publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Play the games and draw them
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/profile_games.py --user "${{ github.repository_owner }}" --out dist

      - name: Publish to the output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "Update profile games"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
