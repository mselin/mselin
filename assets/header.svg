<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330" role="img" aria-label="Terminal: Mika Selin, full-stack and DevOps engineer, homelab builder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1420"/>
      <stop offset="1" stop-color="#080b10"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ddc97"/>
      <stop offset="1" stop-color="#5cc8ff"/>
    </linearGradient>
    <clipPath id="c1"><rect x="0" y="62" height="30" width="0"><animate attributeName="width" from="60" to="840" begin="0.4s" dur="1.2s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="0" y="150" height="30" width="0"><animate attributeName="width" from="60" to="840" begin="2.2s" dur="1.2s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="0" y="248" height="30" width="0"><animate attributeName="width" from="60" to="840" begin="4.4s" dur="1.2s" fill="freeze"/></rect></clipPath>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 16px; }
      .p { fill: #3ddc97; } .c { fill: #e6edf3; } .o { fill: #9fb0c0; } .k { fill: #5cc8ff; } .a { fill: #ffb454; } .d { fill: #5b6b7b; }
      .out { opacity: 0; }
      .cur { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect x="1" y="1" width="838" height="328" rx="12" fill="url(#bg)" stroke="#223040" stroke-width="2"/>
  <path d="M1 13a12 12 0 0 1 12-12h814a12 12 0 0 1 12 12v27H1z" fill="#121a26"/>
  <circle cx="24" cy="21" r="6" fill="#ff5f57"/><circle cx="44" cy="21" r="6" fill="#febc2e"/><circle cx="64" cy="21" r="6" fill="#28c840"/>
  <text x="420" y="26" text-anchor="middle" class="d" style="font-size:13px">mika@homelab: ~</text>

  <!-- 1: whoami -->
  <g clip-path="url(#c1)"><text x="28" y="82"><tspan class="p">❯ </tspan><tspan class="c">whoami</tspan></text></g>
  <g class="out"><animate attributeName="opacity" to="1" begin="1.1s" dur="0.2s" fill="freeze"/>
    <text x="28" y="120" style="font-size:30px;font-weight:700" fill="url(#name)">Mika Selin</text>
    <text x="232" y="118" class="o">Full-stack and DevOps engineer · homelab builder</text>
  </g>

  <!-- 2: focus -->
  <g clip-path="url(#c2)"><text x="28" y="170"><tspan class="p">❯ </tspan><tspan class="c">cat focus.txt</tspan></text></g>
  <g class="out"><animate attributeName="opacity" to="1" begin="3.1s" dur="0.2s" fill="freeze"/>
    <text x="28" y="198"><tspan class="k">infra    </tspan><tspan class="o">self-hosted platform · ZFS · containers · Kubernetes</tspan></text>
    <text x="28" y="222"><tspan class="k">security </tspan><tspan class="o">segmented network · SSO everywhere · secrets · detection</tspan></text>
  </g>

  <!-- 3: status -->
  <g clip-path="url(#c3)"><text x="28" y="268"><tspan class="p">❯ </tspan><tspan class="c">lab status</tspan></text></g>
  <g class="out"><animate attributeName="opacity" to="1" begin="5.3s" dur="0.2s" fill="freeze"/>
    <text x="28" y="298"><tspan class="p">● </tspan><tspan class="o">platform up   </tspan><tspan class="p">● </tspan><tspan class="o">backups replicated   </tspan><tspan class="p">● </tspan><tspan class="o">cluster up</tspan></text>
    <rect class="cur" x="560" y="283" width="10" height="19" fill="#3ddc97"/>
  </g>
</svg>
